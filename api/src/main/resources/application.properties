spring.application.name=expense-tracker-api

# --- Database -------------------------------------------------------------
# ค่าเริ่มต้นชี้ Postgres ในเครื่อง ทับได้ด้วย environment variable ตอน deploy
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/expense_tracker}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:devpass}

# ให้ Flyway เป็นเจ้าของ schema แต่ผู้เดียว Hibernate ห้ามแตะ
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Connection pool ------------------------------------------------------
# ตั้งไว้ให้เห็นชัดเพราะเป็นตัวแปรสำคัญตอน load test
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=3000

# --- Actuator -------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true

# --- Server ---------------------------------------------------------------
server.port=${PORT:8080}
server.shutdown=graceful
server.compression.enabled=true

# ปิด stack trace ใน response ไม่ให้หลุดรายละเอียดภายในออกไป
server.error.include-stacktrace=never
server.error.include-message=always
