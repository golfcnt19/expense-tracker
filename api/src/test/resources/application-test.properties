# ฐานข้อมูลสำหรับเทสต์ แยกคนละตัวกับ dev
#
# ในเครื่อง  ใช้ Postgres ที่ติดตั้งไว้ (ไม่ต้องมี Docker)
# ใน CI      GitHub Actions ยิง service container มาให้แล้ว override ผ่าน env
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/expense_tracker_test}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:devpass}

# ล้าง schema ทุกครั้งที่รันเทสต์ ให้เริ่มจากศูนย์เสมอ
spring.flyway.clean-disabled=false
spring.flyway.clean-on-validation-error=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# เทสต์ไม่ต้องการ pool ใหญ่
spring.datasource.hikari.maximum-pool-size=5

logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
