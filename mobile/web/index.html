<!DOCTYPE html>
<html lang="th">
<head>
  <!-- flutter build จะแทนค่านี้ด้วย --base-href ที่ส่งเข้ามา อย่าแก้ -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="ระบบบันทึกค่าใช้จ่าย — Flutter client ต่อกับ Spring Boot API">

  <!-- ── ติดตั้งบนหน้าจอโฮมของ iPhone / iPad ────────────────────────────
       apple-mobile-web-app-capable คือตัวที่ทำให้ iOS เปิดแบบเต็มจอ
       ไม่มีแถบ URL และไม่มีปุ่ม back ของ Safari
       ถ้าขาดบรรทัดนี้ กดจากหน้าจอโฮมแล้วจะยังเห็นแถบเบราว์เซอร์อยู่     -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- black-translucent ทำให้พื้นหลังแอปไหลขึ้นไปใต้ status bar
       เข้ากับธีมดำ ไม่มีแถบขาวคาดหัว -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Expense">
  <meta name="theme-color" content="#070B0D">
  <meta name="color-scheme" content="dark">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Expense Tracker</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* กันจอขาววาบก่อน Flutter จะวาดเสร็จ */
    html, body { margin: 0; padding: 0; background: #070B0D; }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
